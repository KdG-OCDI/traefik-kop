# Builds the OCDI image from branch `ocdi`: ghcr.io/kdg-ocdi/traefik-kop:ocdi and :ocdi-<sha>.
name: ocdi image
on:
  push:
    branches: [ocdi]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ocdi
          push: true
          tags: |
            ghcr.io/kdg-ocdi/traefik-kop:ocdi
            ghcr.io/kdg-ocdi/traefik-kop:ocdi-${{ github.sha }}
